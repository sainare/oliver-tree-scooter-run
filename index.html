      if (!myId) claimId();
      var local = readJSON(KEY_SCORES) || {}, merged = {}, up = {}, k;
      [cloudScores, local].forEach(function (src) {
        for (k in src) {
          var v = parseInt(src[k], 10) || 0;
          if (!(k in merged) || v > merged[k]) merged[k] = v;
        }
      });
      var data = JSON.stringify(merged);
      lsSet(KEY_SCORES, data);
      cookieSet(KEY_SCORES, data);
      for (k in merged) if ((cloudScores[k] || 0) < merged[k]) up[k] = merged[k];
      var cfg = readJSON(KEY_CFG) || {};
      var jobs = [];
      if (Object.keys(up).length) jobs.push(db('PATCH', '/scores', up).then(function () {
        for (var u in up) cloudScores[u] = up[u]; }));
      if (cloud.looks && typeof cloud.looks === 'object') {
        cfg.looks = cloud.looks;
        lsSet(KEY_CFG, JSON.stringify(cfg));
      } else if (cfg.looks && Object.keys(cfg.looks).length) {
        jobs.push(db('PUT', '/looks', cfg.looks));
      }
      if (cloud.nick) {                 // ник как при создании, а не как набрали сейчас
        sess.nick = st.nick = String(cloud.nick);
        lsSet(KEY_SESS, JSON.stringify(sess));
      } else {
        jobs.push(db('PUT', '/nick', sess.nick));
      }
      // настройки игры: в облаке уже есть — берём их (профиль едет вместе с игроком),
      // нет — отправляем настройки этого устройства. Стиль персонажей едет отдельно (looks)
      var lc = readJSON(KEY_CFG) || {};
      if (cloud.settings && typeof cloud.settings === 'object') {
        for (var sk in cloud.settings) if (sk !== 'looks' && sk !== 'ver') lc[sk] = cloud.settings[sk];
        lsSet(KEY_CFG, JSON.stringify(lc));
        settingsRev++;
      } else if (Object.keys(lc).length) {
        jobs.push(db('PUT', '/settings', cleanSettings(lc)));
      }
      var cw = cloud.wallet || {};
      var mw = mergeWallet(readJSON('oliver_wallet') || {}, cw);   // всё только растёт: берём большее
      lsSet('oliver_wallet', JSON.stringify(mw));
      cloudWallet = cw;
      if (walletGrew(mw, cw)) jobs.push(db('PUT', '/wallet', mw).then(function () { cloudWallet = mw; }));
      pushBoard(merged);
      fetchRequests();
      return Promise.all(jobs).then(function () { return applyGrants(); });
    }).then(function () { st.rev++; showInbox(); });
  }

  var MSG = {
    EMAIL_EXISTS: 'Такой ник уже занят', EMAIL_NOT_FOUND: 'Неверный ник или пароль',
    INVALID_PASSWORD: 'Неверный ник или пароль', INVALID_LOGIN_CREDENTIALS: 'Неверный ник или пароль',
    WEAK_PASSWORD: 'Пароль — минимум 6 символов', NICK_LEN: 'Ник — от 3 до 16 символов',
    NICK_CHARS: 'В нике только буквы, цифры, пробел и _ . -',
    TOO_MANY_ATTEMPTS_TRY_LATER: 'Слишком много попыток, попробуй позже',
    USER_DISABLED: 'Аккаунт отключён', OFFLINE: 'Нет интернета',
    NEED_PW: 'Чтобы сменить ник, введи пароль', BAD_PW: 'Неверный пароль',
    FR_HAVE: 'Вы уже друзья', FR_SHORT: 'ID друга — шесть цифр', FR_SELF: 'Это твой собственный ID', FR_NONE: 'Игрок с таким ID не найден',
    BAD_NUM: 'Рекорд — число от 0 до 99999999', EMPTY: 'Напиши сообщение', DB_401: 'Нет доступа (для чата нужна дружба)',

  };
  function human(e) {
    var code = String((e && e.code) || (e && e.message) || '');
    if (code.indexOf('WEAK_PASSWORD') === 0) code = 'WEAK_PASSWORD';
    if (e instanceof TypeError || /Failed to fetch|NetworkError/.test(code)) code = 'OFFLINE';
    return MSG[code] || ('Ошибка: ' + code);
  }

  function login(nick, pass, create) {
    nick = cleanNick(nick);
    if (nick.length < 3 || nick.length > 16) return Promise.reject(fail('NICK_LEN'));
    if (!/^[0-9A-Za-zА-Яа-яЁё _.\-]+$/.test(nick)) return Promise.reject(fail('NICK_CHARS'));
    if (String(pass).length < 6) return Promise.reject(fail('WEAK_PASSWORD'));
    return emailOf(nick).then(function (email) {
      return post(AUTH + '/accounts:' + (create ? 'signUp' : 'signInWithPassword') + '?key=' + C.apiKey,
                  { email: email, password: String(pass), returnSecureToken: true });
    }).then(function (j) {
      sess = { uid: j.localId, nick: nick, refresh: j.refreshToken };
      idToken = j.idToken;
      idUntil = Date.now() + (parseInt(j.expiresIn, 10) - 60) * 1000;
      lsSet(KEY_SESS, JSON.stringify(sess));
      st.in = true; st.nick = nick;
      return sync();
    });
  }
  // ---- вход через Google: в браузере — окно Google и возврат на auth.html (тот же
  // сайт, токен приходит через localStorage); в приложении — системный браузер
  // и возврат по ссылке olivertree://auth?id_token=... ----
  function b64json(part) {
    try { return JSON.parse(decodeURIComponent(escape(atob(part.replace(/-/g, '+').replace(/_/g, '/'))))); }
    catch (e) { return null; }
  }
  function googleNick(name, uid) {
    var n = String(name || '').replace(/[^0-9A-Za-zА-Яа-яЁё _.\-]/g, '').replace(/\s+/g, ' ').trim().slice(0, 16).trim();
    return n.length >= 3 ? n : ('Игрок' + String(uid).slice(0, 4));
  }
  function googleStart() {
    var isApp = !!(window.OTNative && window.OTNative.openUrl);
    var nonce = Array.prototype.map.call(crypto.getRandomValues(new Uint8Array(16)), function (b) {
      return ('0' + b.toString(16)).slice(-2); }).join('');
    lsSet('oliver_gnonce', nonce);
    var url = 'https://accounts.google.com/o/oauth2/v2/auth?client_id=' + encodeURIComponent(GOOGLE.id) +
      '&redirect_uri=' + encodeURIComponent(GOOGLE.page) + '&response_type=id_token' +
      '&scope=' + encodeURIComponent('openid email profile') + '&nonce=' + nonce +
      '&prompt=select_account&state=' + (isApp ? 'app' : 'web');
    if (isApp) { window.OTNative.openUrl(url); return 'app'; }
    return window.open(url, 'ot-google', 'width=480,height=660') ? 'web' : 'blocked';
  }
  function googleLogin(idt) {
    var p = String(idt).split('.');
    var claims = p.length === 3 ? b64json(p[1]) : null;
    if (!GOOGLE || !claims || !claims.nonce || claims.nonce !== lsGet('oliver_gnonce') ||
        String(claims.aud) !== GOOGLE.id) return Promise.reject(fail('GOOGLE_BAD'));
    lsDel('oliver_gnonce');
    return post(AUTH + '/accounts:signInWithIdp?key=' + C.apiKey,
      { postBody: 'id_token=' + encodeURIComponent(idt) + '&providerId=google.com',
        requestUri: 'http://localhost', returnIdpCredential: true, returnSecureToken: true }).then(function (j) {
      var nick = googleNick(j.displayName, j.localId);
      sess = { uid: j.localId, nick: nick, refresh: j.refreshToken };
      idToken = j.idToken;
      idUntil = Date.now() + (parseInt(j.expiresIn, 10) - 60) * 1000;
      lsSet(KEY_SESS, JSON.stringify(sess));
      st.in = true; st.nick = nick;
      return sync();
    });
  }
  function onGoogleToken(idt) {
    st.busy = true; st.msg = 'Вхожу через Google…'; st.msgOk = true; if (root) render();
    googleLogin(idt).then(function () {
      st.busy = false; st.msg = 'Готово!'; st.msgOk = true; if (root) render();
    }, function (e) {
      st.busy = false;
      if (!st.in) { st.msg = human(e); st.msgOk = false; } else { st.msg = 'Вошёл, но не удалось обновить данные'; st.msgOk = false; }
      if (root) render();
    });
  }
  window.addEventListener('storage', function (e) {
    if (e.key === 'oliver_idt' && e.newValue) { lsDel('oliver_idt'); onGoogleToken(e.newValue); }
  });

  // ---- сброс: номер сброса в облаке (config/resetEpoch) больше сохранённого у игрока ->
  // рекорды и кассеты на этом устройстве обнуляются, а закрытый аккаунт разлогинивается ----
  function checkReset() {
    fetch(DB + '/config/resetEpoch.json').then(function (r) { return r.ok ? r.json() : null; }).then(function (e) {
      e = parseInt(e, 10);
      if (!e) return;
      var mine = parseInt(lsGet('oliver_epoch'), 10) || 0;
      if (e <= mine) return;
      lsSet('oliver_epoch', String(e));
      lsDel(KEY_SCORES); lsDel('oliver_wallet'); cookieSet(KEY_SCORES, '{}');
      cloudScores = {}; cloudWallet = {}; boardBest = -1;
      if (sess) logout();
      resetCount++; st.rev++;
    }).catch(function () {});
  }
  function deadAccount(e) {
    var c = String((e && e.code) || (e && e.message) || '');
    if (/INVALID_REFRESH_TOKEN|USER_NOT_FOUND|TOKEN_EXPIRED|USER_DISABLED/.test(c)) { logout(); return true; }
    return false;
  }

  // ---- кошелёк: кассеты, потраченное и вечные покупки (все числа только растут) ----
  function mergeWallet(a, b) {
    a = a || {}; b = b || {};
    var out = { tapes: Math.max(parseInt(a.tapes, 10) || 0, parseInt(b.tapes, 10) || 0),
                spent: Math.max(parseInt(a.spent, 10) || 0, parseInt(b.spent, 10) || 0), perm: {} };
    [a.perm || {}, b.perm || {}].forEach(function (p) {
      for (var k in p) out.perm[k] = Math.max(out.perm[k] || 0, parseInt(p[k], 10) || 0);
    });
    return out;
  }
  function walletGrew(a, b) {
    b = b || {};
    if ((a.tapes || 0) > (parseInt(b.tapes, 10) || 0) || (a.spent || 0) > (parseInt(b.spent, 10) || 0)) return true;
    for (var k in (a.perm || {})) if (a.perm[k] > ((b.perm || {})[k] || 0)) return true;
    return false;
  }

  // ---- настройки игры в облаке ----
  function cleanSettings(c) {
    var o = {}, k;
    for (k in c) if (k !== 'looks' && k !== 'ver' && /^[A-Za-z0-9_]+$/.test(k)) {
      var v = c[k];
      if (typeof v === 'number' || typeof v === 'boolean') o[k] = v;
    }
    return o;
  }

  // ---- профиль и друзья ----
  // числовой ID игрока (шесть цифр) — его друзья вводят вместо длинного кода.
  // Занимается случайный свободный номер в ids/{номер} = uid (правила базы не дают
  // перезаписать чужой), и записывается в users/{uid}/numId.
  function myCode() { return myId; }
  function claimId() {
    if (claiming || !sess) return;
    claiming = true;
    var tries = 0;
    (function attempt() {
      var n = String(100000 + Math.floor(Math.random() * 900000));
      dbRoot('PUT', '/ids/' + n, sess.uid).then(function () {
        return db('PUT', '/numId', n).then(function () { myId = n; claiming = false; st.rev++; });
      }, function (e) {
        if (++tries < 12 && !deadAccount(e)) attempt(); else claiming = false;   // занят — берём другой
      });
    })();
  }
  function localBest() {
    var b = 0, k, s = readJSON(KEY_SCORES) || {};
    for (k in s) b = Math.max(b, parseInt(s[k], 10) || 0);
    for (k in cloudScores) b = Math.max(b, parseInt(cloudScores[k], 10) || 0);
    return b;
  }
  // grants/{uid}/{id} пишет только админ (правила), claimed/{uid}/{id} — отметка «получено»,
  // пишется один раз и только если выдача существует. Кассеты и предметы зачисляются в кошелёк
  // одним атомарным запросом вместе с отметкой — повторно получить выдачу нельзя.
  var inboxItems = [], defaultsRev = 0;
  var ITEM_NAMES = { djump: 'двойной прыжок', hp: 'доп. жизнь' };
  function applyGrants() {
    return Promise.all([dbRoot('GET', '/grants/' + sess.uid), dbRoot('GET', '/claimed/' + sess.uid)]).then(function (r) {
      var g = r[0] || {}, claimed = r[1] || {};
      var ids = Object.keys(g).filter(function (k) { return !claimed[k] && g[k]; });
      if (!ids.length) return null;
      var mw = mergeWallet(readJSON('oliver_wallet') || {}, cloudWallet), add = 0, said = [], k;
      ids.forEach(function (id) {
        var x = g[id], n = Math.max(0, parseInt(x.tapes, 10) || 0);
        add += n; if (n) said.push('+' + n + ' кассет');
        for (k in (x.perm || {})) {
          var lv = parseInt(x.perm[k], 10) || 0;
          if (lv > (mw.perm[k] || 0)) { mw.perm[k] = lv; said.push((ITEM_NAMES[k] || k) + (lv > 1 ? ' ' + lv : '')); }
        }
      });
      mw.tapes += add;
      var upd = {};
      upd['users/' + sess.uid + '/wallet'] = mw;
      ids.forEach(function (id) { upd['claimed/' + sess.uid + '/' + id] = true; });
      return dbRoot('PATCH', '/', upd).then(function () {
        lsSet('oliver_wallet', JSON.stringify(mw)); cloudWallet = mw;
        if (said.length) inboxItems.push({ text: 'Админ выдал тебе: ' + said.join(', ') });
      });
    }).catch(function () {}).then(function () {
      return dbRoot('GET', '/inbox/' + sess.uid).then(function (m) {
        Object.keys(m || {}).sort().forEach(function (id) {
          if (m[id] && m[id].text) inboxItems.push({ id: id, text: String(m[id].text) });
        });
      }).catch(function () {});
    });
  }
  function showInbox() {
    if (!inboxItems.length) return;

    if (st.open) render(); else show();
  }
  function adminFindUid(code) {
    code = String(code || '').replace(/\D/g, '');

  }
  function adminLoad(uid) {

      if (e) return { uid: uid, nick: String(e.nick || '?'), best: parseInt(e.best, 10) || 0, status: String(e.status || '') };
      return dbRoot('GET', '/users/' + uid + '/nick').then(function (n) {
        return { uid: uid, nick: String(n || '?'), best: 0, status: '' };
      });
    });
  }
  function adminGrant(uid, tapes, perm) {
    var g = { t: Date.now() };
    tapes = parseInt(tapes, 10) || 0;

    if (tapes) g.tapes = tapes;
    if (perm && Object.keys(perm).length) g.perm = perm;
    if (!g.tapes && !g.perm) return Promise.reject(fail('EMPTY'));
    return dbRoot('POST', '/grants/' + uid, g);
  }
  function adminMessage(uid, text) {

  // песни по умолчанию для всех: config/defaultPicks {menu, select, game, load} (0 — случайная)
  function adminDefaults(picks) {

  }
  function fetchDefaults() {

      if (d && typeof d === 'object') lsSet('oliver_remote_picks', JSON.stringify(d)); else lsDel('oliver_remote_picks');
      defaultsRev++; st.rev++;
    }).catch(function () {});
  }
  // ---- админ: uid игрока Kadronina зашит и в правилах базы (там настоящая защита);
  // здесь он только открывает кнопки. Админ правит рекорды, удаляет строки, обнуляет всё. ----
  function isAdmin() { return !!(sess && sess.uid === String(C.adminUid || 'gtmMmK9AMNSoOTDoWjmhYcTmOrh2')); }
  function adminSet(uid, nick, status, best) {
    best = parseInt(best, 10);
    if (!(best >= 0) || best >= 100000000) return Promise.reject(fail('BAD_NUM'));
    nick = cleanNick(nick);
    if (nick.length < 3 || nick.length > 16) return Promise.reject(fail('NICK_LEN'));

  function adminDelete(uid) {
    return dbRoot('DELETE', '/leaderboard/' + uid).then(function () {
      return dbRoot('DELETE', '/users/' + uid + '/scores').catch(function () {});
    }).then(function () { fetchTop(); });

  // обнулить всех: рекорды и кассеты в облаке, таблица, и новый номер сброса —
  // устройства игроков сами очистятся при следующем запуске (checkReset)
  function adminReset() {
    var epoch;
    return token().then(function (t) {
      return fetch(DB + '/users.json?shallow=true&auth=' + encodeURIComponent(t));
    }).then(function (r) {
      if (!r.ok) throw fail('DB_' + r.status);
      return r.json();
    }).then(function (u) {
      var upd = {};
      Object.keys(u || {}).forEach(function (k) { upd[k + '/scores'] = null; upd[k + '/wallet'] = null; });
      return Object.keys(upd).length ? dbRoot('PATCH', '/users', upd) : null;
    }).then(function () {
      return dbRoot('DELETE', '/leaderboard');
    }).then(function () {
      return dbRoot('GET', '/config/resetEpoch');
    }).then(function (e) {
      epoch = (parseInt(e, 10) || 0) + 1;
      return dbRoot('PUT', '/config/resetEpoch', epoch);
    }).then(function () {
      // это устройство админа очищаем сами, без выхода из аккаунта
      lsSet('oliver_epoch', String(epoch));
      lsDel(KEY_SCORES); lsDel('oliver_wallet'); cookieSet(KEY_SCORES, '{}');
      cloudScores = {}; cloudWallet = {}; boardBest = -1;
      resetCount++; st.rev++; fetchTop();
    });
  }
  // ---- чат с другом: chats/{пара}/{id сообщения} = {from, text, t}; пара = два uid по алфавиту ----
  function pairId(a, b) { return a < b ? a + '_' + b : b + '_' + a; }
  function fetchChat(uid) {
    return token().then(function (t) {
      return fetch(DB + '/chats/' + pairId(sess.uid, uid) + '.json?orderBy=%22%24key%22&limitToLast=60&auth=' + encodeURIComponent(t));
    }).then(function (r) {
      if (!r.ok) throw fail('DB_' + r.status);
      return r.json();
    }).then(function (j) {
      var out = [];
      for (var k in (j || {})) out.push({ id: k, from: j[k].from, text: String(j[k].text || ''), t: j[k].t || 0 });
      out.sort(function (a, b) { return a.t - b.t || (a.id < b.id ? -1 : 1); });
      return out;
    });
  }
  function sendChat(uid, text) {
    text = String(text || '').replace(/\s+/g, ' ').trim();
    if (!text) return Promise.reject(fail('EMPTY'));
    if (text.length > 200) text = text.slice(0, 200);
    return dbRoot('POST', '/chats/' + pairId(sess.uid, uid), { from: sess.uid, text: text, t: Date.now() });
  }
  var chatTimer = null;
  function chatStop() { if (chatTimer) { clearInterval(chatTimer); chatTimer = null; } }
  function friendRow(u) {
    return fetch(DB + '/leaderboard/' + u + '.json').then(function (r) { return r.json(); }).then(function (e) {
      return e ? { uid: u, nick: String(e.nick || '?'), best: parseInt(e.best, 10) || 0, status: String(e.status || '') }
               : { uid: u, nick: '?', best: 0, status: '' };
    }).catch(function () { return { uid: u, nick: '?', best: 0, status: '' }; });
  }
  function friendIds() {
    return Promise.all([db('GET', '/friends').catch(function () { return null; }),
                        dbRoot('GET', '/friends/' + sess.uid).catch(function () { return null; })]).then(function (r) {
      var set = {}, k;
      for (k in (r[0] || {})) set[k] = true;
      for (k in (r[1] || {})) set[k] = true;
      return Object.keys(set);
    });
  }
  function fetchFriends() {
    if (!sess) { friends = { state: 'off', rows: [] }; return; }
    friends = { state: 'loading', rows: [] };
    friendIds().then(function (ids) {
      return Promise.all(ids.map(friendRow));
    }).then(function (rows) {
      rows.sort(function (a, b) { return b.best - a.best; });
      friends = { state: 'ok', rows: rows };
    }, function (e) { if (!deadAccount(e)) friends = { state: 'error', rows: [] }; });
  }
  // запросы в друзья: requests/{кому}/{от кого} = true. Принять — оба пишут друг друга в friends/
  function fetchRequests() {
    if (!sess) { requests = { state: 'off', rows: [] }; return; }
    requests = { state: 'loading', rows: [] };
    dbRoot('GET', '/requests/' + sess.uid).then(function (r) {
      return Promise.all(Object.keys(r || {}).map(friendRow));
    }).then(function (rows) {
      rows.sort(function (a, b) { return b.best - a.best; });
      requests = { state: 'ok', rows: rows }; st.rev++;
    }, function (e) { if (!deadAccount(e)) requests = { state: 'error', rows: [] }; });
  }
  function acceptRequest(uid) {
    // сначала записываем себя ему (правила разрешают, пока запрос существует), потом его себе
    return dbRoot('PUT', '/friends/' + uid + '/' + sess.uid, true).then(function () {
      return dbRoot('PUT', '/friends/' + sess.uid + '/' + uid, true);
    }).then(function () {
      return dbRoot('DELETE', '/requests/' + sess.uid + '/' + uid);
    }).then(function () { fetchRequests(); fetchFriends(); });
  }
  function declineRequest(uid) {
    return dbRoot('DELETE', '/requests/' + sess.uid + '/' + uid).then(function () { fetchRequests(); });
  }
  function addFriend(code) {
    code = String(code || '').replace(/\D/g, '');
    if (code.length !== 6) return Promise.reject(fail('FR_SHORT'));
    if (code === myCode()) return Promise.reject(fail('FR_SELF'));
    var other;
